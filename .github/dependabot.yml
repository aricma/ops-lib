version: 2
updates:
  # Rust library
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # Bindings (manifests not present yet — entries activate as each
  # wrapper ships its first package)
  - package-ecosystem: npm
    directory: /bindings/node
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /bindings/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: nuget
    directory: /bindings/dotnet
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /bindings/go
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
