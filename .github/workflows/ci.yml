name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lib:
    name: ops-lib (${{ matrix.os }})
    needs: [fixtures]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Fast feedback
      - run: cargo fmt --check
      - run: cargo check --all-targets --all-features
      # Validation
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      # Docs must build clean, too
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  audit:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: EmbarkStudios/cargo-deny-action@v2

  fixtures:
    name: OPS fixtures Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/update-fixtures.sh check

  node:
    name: node binding
    needs: [lib, audit]
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "TODO: napi-rs build + test (bindings/node)"'

  python:
    name: python binding
    needs: [lib, audit]
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "TODO: uniffi + maturin build + test (bindings/python)"'

  dotnet:
    name: dotnet binding
    needs: [lib, audit]
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "TODO: uniffi-bindgen-cs build + test (bindings/dotnet)"'

  go:
    name: go binding
    needs: [lib, audit]
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "TODO: cgo build + test (bindings/go)"'
